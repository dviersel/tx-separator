name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Generate release tag
        id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Generate tag based on date and short commit SHA
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TAG="v$(date +'%Y.%m.%d')-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Installation

            Download the `.whl` file and install with:
            ```bash
            pip install tx_separator-*.whl
            ```

            Or download the `.tar.gz` source distribution and install with:
            ```bash
            pip install tx-separator-*.tar.gz
            ```

            ## Changes

            See commit ${{ steps.tag.outputs.sha }} for details.
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
